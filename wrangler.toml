name = "obsidian-share-hosted-worker"
main = "src/index.ts"
compatibility_date = "2026-05-30"

[[r2_buckets]]
binding = "R2"
bucket_name = "share-hosted"

[[d1_databases]]
binding = "DB"
database_name = "share-hosted"
database_id = "98673ca8-83fa-4681-ba82-245c2b1f00ad"

[vars]
MAIL_FROM_NAME = "Share Hosted"
# MAIL_FROM must be an address on a domain verified in Resend (workers.dev cannot be verified).
# Set it here or as a secret, and set RESEND_API_KEY with `wrangler secret put`. See DEPLOY.md.
# MAIL_FROM = "noreply@share.example.com"
